[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/data/missions.json"]

# 환경변수 (Netlify 대시보드 > Site configuration > Environment variables 에서 설정)
#   UPSTAGE_API_KEY   = Upstage Console 에서 발급한 키 (필수, 브라우저 코드에 절대 넣지 않음)
#   SOLAR_RUN_MODEL   = 실행 모델 (기본 solar-mini4)
#   SOLAR_JUDGE_MODEL = 판정 모델 (기본 solar-pro4 — mini4 판정이 불안정해 분리함)
#   SESSION_SECRET    = 세션 토큰 서명용 임의 문자열 (선택)

# 보안 헤더 (개인정보 처리방침 '안전성 확보 조치'와 맞춰 둘 것)
# 디버그 아레나: Pyodide(브라우저 파이썬)를 jsDelivr 에서 불러오므로 script/connect 에 jsDelivr 와 wasm 실행을 허용
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
